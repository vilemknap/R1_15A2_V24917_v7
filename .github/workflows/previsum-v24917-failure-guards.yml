name: Pre-Visum V24917 failure guards
on:
  push:
    branches:
      - codex/v24917-previsum-failure-guards-20261029
      - codex/fix-v240-op20-inactive-partials-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared offline verification dependencies
        run: python -m pip install numpy pytest
      - name: Compile changed Python modules
        run: |
          python -m py_compile r1_15a2_long_post_td_mask_v24917.py
          python -m py_compile r1_15a2_preflight_explain_v24917.py
          python -m py_compile tests/test_v24917_preflight_op20_partial_activation.py
          python -m py_compile tests/test_v24917_longmask_09c_live_scope_regression.py
      - name: Verify sealed runtime and DIAGFAST files (read only)
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path.cwd()
          for filename, key in [
              ("V24917_RUNTIME_MANIFEST.json", "required_files"),
              ("DIAGFAST_V1_RELEASE_MANIFEST.json", "files"),
          ]:
              manifest = json.loads((root / filename).read_text("utf-8"))
              failed = []
              for rel, expected in manifest[key].items():
                  path = root / rel
                  if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                      failed.append(rel)
              print(filename, "checked=", len(manifest[key]), "failed=", len(failed), failed[:8])
              if failed:
                  raise SystemExit(1)
          PY
      - name: Exact 09C scope, V240 preflight and LONGMASK regression
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_v24917_preflight_op20_partial_activation.py tests/test_v239_safety_gates.py tests/test_v240_full_overnight.py tests/test_v24917_longmask_09c_live_scope_regression.py tests/test_v24917_long_post_td_mask.py
      - name: Source/working-copy operation difference regression
        run: python -m pytest -q -p no:cacheprovider tests/test_v24917_working_copy_operation_diff.py
      - name: Full main regression in isolated process
        run: python -m pytest -q -p no:cacheprovider tests
      - name: DIAGFAST suite in isolated process
        run: python -m pytest -q -p no:cacheprovider diagfast_tests
      - name: GENFIX2 audit suite in isolated process
        run: python -m pytest -q -p no:cacheprovider genfix2_audit_tests
