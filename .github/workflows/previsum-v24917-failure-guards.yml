name: Pre-Visum V24917 failure guards
on:
  push:
    branches:
      - codex/v24917-previsum-failure-guards-20261029
      - codex/fix-v240-op20-inactive-partials-20261029
      - codex/v24917-op17-20-and-matrix-com-array-fix-20261029
      - codex/v24917-formula-longmask-silent-debug-20261029
      - codex/v24917-school-fp-link-guard-20261030
      - codex/v24917-unlock-long-zonal-tg-composite-td-20261030
      - codex/v24917-school-td-finecdf-active-20261030
      - codex/resume-a0001-td-no-enum-20261030
      - codex/resume-a0001-sibling-run-root-fix-20261030
      - codex/a0001-matrix-semantic-forensic-20261030
      - codex/a0001-hard-disk-reload-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared offline verification dependencies
        run: python -m pip install numpy pytest
      - name: Compile changed Python modules
        run: |
          python -m py_compile r1_15a2_long_post_td_mask_v24917.py
          python -m py_compile r1_15a2_mobility_zone_v24917.py
          python -m py_compile r1_15a2_demand_policy_v1.py
          python -m py_compile r1_15a2_long_composite_td_v24917.py
          python -m py_compile r1_15a2_school_td_v24917.py
          python -m py_compile tests/test_v24917_school_td_activation.py
          python -m py_compile r1_15a2_td_joint_v24917.py
          python -m py_compile r1_15a2_td_joint_runtime_v24917.py
          python -m py_compile r1_15a2_finecdf_bridge_v24916.py
          python -m py_compile tests/test_v24917_long_tg_td_unlock.py
          python -m py_compile r1_15a2_trial_adapter_v24917.py
          python -m py_compile tests/test_v24917_mobilityzone1.py
          python -m py_compile tests/test_v24917_long_cache_generation.py
          python -m py_compile r1_15a2_preflight_explain_v24917.py
          python -m py_compile tests/test_v24917_preflight_op20_partial_activation.py
          python -m py_compile tests/test_v24917_longmask_09c_live_scope_regression.py
          python -m py_compile tests/test_v24917_long_post_td_mask.py
          python -m py_compile v24917_silent_debug.py
          python -m py_compile 01_SPUSTIT_V24917_TDJOINT1_SILENT.py
          python -m py_compile tests/test_v24917_silent_debug.py
          python -m py_compile r1_15a2_resume_a0001_v24917.py
          python -m py_compile tests/test_v24917_resume_a0001_td_no_enum.py
      - name: Verify sealed runtime and DIAGFAST files (read only)
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path.cwd()
          for filename, key in [
              ("V24917_RUNTIME_MANIFEST.json", "required_files"),
              ("DIAGFAST_V1_RELEASE_MANIFEST.json", "files"),
          ]:
              manifest = json.loads((root / filename).read_text("utf-8"))
              failed = []
              for rel, expected in manifest[key].items():
                  path = root / rel
                  if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                      failed.append(rel)
              print(filename, "checked=", len(manifest[key]), "failed=", len(failed), failed[:8])
              if failed:
                  raise SystemExit(1)
          PY
      - name: Exact 09C scope, V240 preflight and LONGMASK regression
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_v24917_school_td_activation.py tests/test_v24917_long_tg_td_unlock.py tests/test_v24917_long_composite_td.py tests/test_v24917_tdjoint1.py tests/test_v24917_long_cache_generation.py tests/test_v24917_mobilityzone1.py tests/test_v24917_long_cache_generation.py tests/test_v24917_preflight_op20_partial_activation.py tests/test_v239_safety_gates.py tests/test_v240_full_overnight.py tests/test_v24917_longmask_09c_live_scope_regression.py tests/test_v24917_long_post_td_mask.py tests/test_v24917_silent_debug.py
      - name: Source/working-copy operation difference regression
        run: python -m pytest -q -p no:cacheprovider tests/test_v24917_working_copy_operation_diff.py
      - name: A0001 TD resume fail-closed path store regression
        run: python -m pytest -q -p no:cacheprovider tests/test_v24917_resume_a0001_td_no_enum.py tests/test_v24917_long_diagnostics_epoch_fix.py
      - name: Full main regression in isolated process
        run: python -m pytest -q -p no:cacheprovider tests
      - name: DIAGFAST suite in isolated process
        run: python -m pytest -q -p no:cacheprovider diagfast_tests
      - name: GENFIX2 audit suite in isolated process
        env:
          PYTHONPATH: ${{ github.workspace }}/tests:${{ github.workspace }}
          R1_AUDIT_EVIDENCE: ${{ runner.temp }}/r1_audit_evidence
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m pytest -q -p no:cacheprovider genfix2_audit_tests
